<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DictaFlow HUD</title>
  <style>
    :root {
      --bg: rgba(18, 18, 22, 0.88);
      --fg-idle: rgba(180, 180, 188, 0.9);
      --fg-recording: #2196F3;
      --fg-processing: #FFB74D;
      --fg-error: #E57373;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --pill-compact-w: 64px;
      --pill-expanded-w: 200px;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      color: white;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
      pointer-events: none;
    }
    .shell {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .pill {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      width: var(--pill-compact-w);
      height: 100%;
      background: var(--bg);
      border-radius: 16px;
      padding: 0 5px;
      box-sizing: border-box;
      pointer-events: auto;
      -webkit-app-region: drag;
      app-region: drag;
      cursor: grab;
      transition: width 0.24s var(--ease);
    }
    body[data-layout="compact"] .pill {
      width: var(--pill-compact-w);
      padding: 0 5px;
      gap: 0;
    }
    body[data-layout="expanded"] .pill {
      justify-content: flex-start;
      width: var(--pill-expanded-w);
      padding: 0 5px 0 8px;
      gap: 6px;
    }
    body[data-state="idle"] .pill { opacity: 0.72; }
    body[data-state="recording"] .pill { opacity: 1; }
    body:active .pill { cursor: grabbing; }

    body[data-style="classic"] .pill {
      position: static;
      width: 100% !important;
      border-radius: 16px;
      justify-content: center;
      gap: 8px;
      padding: 0 8px;
    }
    body[data-style="classic"][data-layout="expanded"] .pill {
      width: 100% !important;
    }

    body[data-style="notch"] .pill {
      background: #000;
      border-radius: 0 0 0 14px;
    }
    body[data-style="notch"][data-state="idle"] .pill { opacity: 1; }

    #mic {
      flex: 0 0 20px;
      order: 3;
      width: 20px;
      height: 20px;
      color: var(--fg-idle);
      transition: color 0.15s var(--ease);
    }
    body[data-state="recording"] #mic { color: var(--fg-recording); }
    body[data-state="processing"] #mic { color: var(--fg-processing); }
    body[data-state="error"] #mic { color: var(--fg-error); }

    #preview {
      flex: 1 1 auto;
      order: 1;
      min-width: 0;
      font-size: 11px;
      line-height: 1.15;
      color: rgba(255, 255, 255, 0.92);
      overflow: hidden;
      white-space: nowrap;
      text-align: left;
      display: none;
    }
    #preview span { display: inline-block; }
    body[data-layout="expanded"][data-style="notch"] #preview { display: block; }
    #preview.empty span {
      color: rgba(255, 255, 255, 0.45);
      font-style: italic;
    }

    #bars {
      display: none;
      align-items: center;
      gap: 4px;
      height: 28px;
      order: 2;
    }
    body[data-style="classic"] #bars { display: flex; }
    .bar {
      width: 4px;
      border-radius: 2px;
      background: var(--fg-idle);
      transition: background 0.15s;
    }
    body[data-state="recording"] .bar { background: var(--fg-recording); }

    #spinner {
      display: none;
      flex: 0 0 auto;
      order: 2;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 179, 77, 0.3);
      border-top-color: var(--fg-processing);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    body[data-state="processing"] #spinner { display: block; }
    body[data-state="processing"][data-style="classic"] #bars { display: none; }
    body[data-style="notch"] #bars { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-state="idle" data-layout="compact" data-style="notch">
  <div class="shell">
    <div class="pill">
      <div id="preview" class="empty"><span>Listening…</span></div>
      <div id="bars">
        <div class="bar" style="height: 4px"></div>
        <div class="bar" style="height: 4px"></div>
        <div class="bar" style="height: 4px"></div>
        <div class="bar" style="height: 4px"></div>
        <div class="bar" style="height: 4px"></div>
      </div>
      <div id="spinner"></div>
      <svg id="mic" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
      </svg>
    </div>
  </div>

  <script>
    const body = document.body;
    const previewEl = document.getElementById('preview');
    const previewTextEl = previewEl.querySelector('span');
    const bars = document.querySelectorAll('.bar');
    let currentRms = 0;
    let smoothed = 0;

    function setPreview(text) {
      const trimmed = String(text || '').trim();
      if (!trimmed) {
        previewTextEl.textContent = 'Listening…';
        previewEl.classList.add('empty');
        previewEl.scrollLeft = 0;
        return;
      }
      previewTextEl.textContent = trimmed;
      previewEl.classList.remove('empty');
      requestAnimationFrame(() => {
        previewEl.scrollLeft = previewEl.scrollWidth;
      });
    }

    function animateBars() {
      smoothed += (currentRms - smoothed) * 0.35;
      const base = 6;
      const maxGrowth = 22;
      const now = Date.now();
      bars.forEach((bar, i) => {
        const phase = (now / 180) + i * 0.7;
        const wiggle = (Math.sin(phase) + 1) / 2;
        const isRecording = body.dataset.state === 'recording';
        const boost = isRecording ? Math.max(smoothed, 0.05) : 0;
        const h = base + boost * maxGrowth * (0.4 + wiggle * 0.6);
        bar.style.height = h.toFixed(1) + 'px';
      });
      requestAnimationFrame(animateBars);
    }
    animateBars();

    async function setup() {
      if (!window.__TAURI__?.event) return false;
      const { listen } = window.__TAURI__.event;
      await listen('state', (e) => {
        body.dataset.state = String(e.payload);
        if (e.payload !== 'recording') currentRms = 0;
      });
      await listen('rms', (e) => {
        currentRms = Math.min(1, Math.max(0, Number(e.payload) || 0));
      });
      await listen('hud_layout', (e) => {
        if (body.dataset.style !== 'notch') return;
        body.dataset.layout = e.payload === 'expanded' ? 'expanded' : 'compact';
        if (e.payload === 'expanded') {
          previewTextEl.textContent = 'Listening…';
          previewEl.classList.add('empty');
          previewEl.scrollLeft = 0;
        } else {
          previewTextEl.textContent = '';
          previewEl.classList.add('empty');
          previewEl.scrollLeft = 0;
        }
      });
      await listen('partial', (e) => {
        if (body.dataset.style === 'notch') setPreview(e.payload);
      });
      await listen('hud_style', (e) => {
        body.dataset.style = String(e.payload) === 'classic' ? 'classic' : 'notch';
      });
      if (window.__TAURI__?.core?.invoke) {
        try {
          body.dataset.style = await window.__TAURI__.core.invoke('get_hud_style');
        } catch (_) {}
      }
      return true;
    }

    async function waitForTauriAndSetup() {
      for (let i = 0; i < 50; i++) {
        if (await setup()) return;
        await new Promise(r => setTimeout(r, 100));
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', waitForTauriAndSetup);
    } else {
      waitForTauriAndSetup();
    }
  </script>
</body>
</html>
