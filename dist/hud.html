<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>DictaFlow HUD</title>
  <style>
    :root {
      --bg: #000000;
      --fg-idle: rgba(180, 180, 188, 0.9);
      --fg-recording: #2196F3;
      --fg-processing: #FFB74D;
      --fg-error: #E57373;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      color: white;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 100%;
      width: 100%;
      background: var(--bg);
      border-radius: 0 0 0 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 0 6px;
      box-sizing: border-box;
      transition: opacity 0.2s, box-shadow 0.15s;
    }
    body[data-edit="true"] {
      -webkit-app-region: drag;
      app-region: drag;
    }
    body[data-edit="true"] .pill {
      box-shadow: 0 0 0 2px #64b5f6, 0 0 12px rgba(100, 181, 246, 0.6);
      cursor: move;
    }
    #mic {
      width: 22px;
      height: 22px;
      color: var(--fg-idle);
      transition: color 0.15s;
    }
    body[data-state="recording"] #mic { color: var(--fg-recording); }
    body[data-state="processing"] #mic { color: var(--fg-processing); }
    body[data-state="error"] #mic { color: var(--fg-error); }
    body[data-state="idle"] .pill { opacity: 1; }
    body[data-state="recording"] .pill { opacity: 1; }

    #spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 179, 77, 0.3);
      border-top-color: var(--fg-processing);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    body[data-state="processing"] #spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #debug {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 9px;
      color: rgba(255,255,255,0.5);
      padding: 1px 3px;
      display: none;
    }
  </style>
</head>
<body data-state="idle">
  <div class="pill">
    <svg id="mic" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
    </svg>
    <div id="spinner"></div>
  </div>
  <div id="debug"></div>

  <script>
    const body = document.body;
    const debugEl = document.getElementById('debug');

    function log(msg) {
      console.log('[DictaFlow HUD]', msg);
    }

    let unlistenState, unlistenRms;
    async function setup() {
      if (!window.__TAURI__ || !window.__TAURI__.event) {
        log('no __TAURI__ yet');
        return false;
      }
      try {
        const { listen } = window.__TAURI__.event;
        unlistenState = await listen('state', (e) => {
          log('state -> ' + e.payload);
          body.dataset.state = String(e.payload);
        });
        await listen('hud_edit', (e) => {
          body.dataset.edit = e.payload ? 'true' : 'false';
        });
        log('listeners attached');
        return true;
      } catch (err) {
        log('setup error: ' + err);
        return false;
      }
    }

    async function waitForTauriAndSetup() {
      for (let i = 0; i < 50; i++) {
        if (await setup()) return;
        await new Promise(r => setTimeout(r, 100));
      }
      log('gave up waiting for __TAURI__');
      debugEl.style.display = 'block';
      debugEl.textContent = 'no IPC';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', waitForTauriAndSetup);
    } else {
      waitForTauriAndSetup();
    }
  </script>
</body>
</html>
