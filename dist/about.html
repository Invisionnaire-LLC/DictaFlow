<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>About DictaFlow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #1e1e22;
      color: #e8e8ec;
    }
    .wrap {
      padding: 28px 32px;
      max-width: 360px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
    }
    h1 { margin: 0 0 4px 0; font-size: 22px; font-weight: 600; }
    .sub { color: #9a9aa0; font-size: 12px; margin-bottom: 20px; }
    dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; font-size: 13px; }
    dt { color: #9a9aa0; }
    dd { margin: 0; color: #e8e8ec; }
    a { color: #64b5f6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #2e2e35;
      font-size: 11px;
      color: #7a7a80;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="invisionnaire.png" alt="Invisionnaire" />
      <h1>DictaFlow</h1>
    </div>
    <div class="sub"><span id="versionLine">0.1.0</span> · by Invisionnaire</div>
    <dl>
      <dt>Build</dt><dd id="buildHash">…</dd>
      <dt>Transcription</dt><dd>whisper-rs · large-v3-turbo</dd>
      <dt>Cleanup</dt><dd>Rules + Ollama · <span id="ollamaModel">gemma3:1b</span></dd>
      <dt>Hotkey</dt><dd>Hold F9 to dictate</dd>
      <dt>Paste</dt><dd>Clipboard + Ctrl/Cmd+V</dd>
      <dt>Platform</dt><dd>Windows · macOS</dd>
    </dl>
    <div class="footer">
      Local-first. All transcription and cleanup runs on your machine.
    </div>
  </div>
  <script>
    (async () => {
      for (let i = 0; i < 50; i++) {
        if (window.__TAURI__?.core?.invoke) break;
        await new Promise((r) => setTimeout(r, 100));
      }
      const invoke = window.__TAURI__?.core?.invoke;
      if (!invoke) return;
      try {
        const info = await invoke("get_build_info");
        document.getElementById("versionLine").textContent = info.version;
        document.getElementById("buildHash").textContent = info.git_hash;
      } catch (_) {}
      invoke("get_ollama_model")
        .then((model) => {
          document.getElementById("ollamaModel").textContent = model;
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
