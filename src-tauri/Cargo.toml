[package]
name = "dictaflow"
version = "0.1.0"
description = "Local-first dictation tool"
authors = ["Invisionnaire"]
edition = "2021"

[[bin]]
name = "dictaflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.15"
hound = "3.5"
arboard = "3"
enigo = "0.2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
dirs = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
fs2 = "0.4"
rubato = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["cuda"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.16", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
