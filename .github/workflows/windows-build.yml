name: Build Windows (CUDA)

# Manual trigger — produces a Windows .msi / .exe for testing.
# The runner has no GPU, but compiling whisper-rs with CUDA only needs the
# CUDA Toolkit (nvcc + cuBLAS), not a GPU. The resulting build REQUIRES an
# NVIDIA GPU + CUDA runtime to RUN.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.5.1'
          method: 'network'
          # whisper.cpp CUDA backend needs nvcc + cudart + cuBLAS.
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Show CUDA version
        run: nvcc --version

      # whisper-rs-sys runs bindgen, which needs libclang.dll (part of LLVM).
      # GitHub's windows-latest ships LLVM; Blacksmith's image does not, so
      # install it explicitly and point bindgen at it via LIBCLANG_PATH.
      - name: Install LLVM (libclang for bindgen)
        run: |
          choco install llvm --no-progress -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build app (release)
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DictaFlow-Windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
